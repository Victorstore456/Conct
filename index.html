<head>

    <title>Link Direto para SMS</title>
    <style>
        body {
            font-family: Arial, sans-serif;

        .sms-link {

            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2em;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Clique no Botão Abaixo para Enviar a Mensagem</h1>
    <p>O médico do seu telefone.</p>

    <a 
        href="sms:+258847747163?body=Ol%C3%A1%20Victor%20Solutions%2C%20preciso%20da%20vossa%20assist%C3%AAncia" 
        class="sms-link">
        Contactar Victor Solutions por SMS
    </a>

</body>
</html>
